<div class="flex flex-col gap-4 max-w-80">
  <label class="flex flex-col gap-2">
    <span>{{ "EXAMPLES.DATEPICKER.YEARS_PER_PAGE.CONTENT.LABEL" | translate }}: {{ yearsPerPage }}</span>
    <input type="range" min="1" max="48" step="1" [(ngModel)]="yearsPerPage" />
  </label>

  <ids-form-field>
    <ids-label>{{ "EXAMPLES.DATEPICKER.COMMON.LABEL" | translate }}</ids-label>
    <input
      #datepicker="idsDatepicker"
      idsInput
      idsDatepicker
      view="year"
      [yearsPerPage]="yearsPerPage"
      [(ngModel)]="date"
    />
    <ids-datepicker-trigger idsSuffix [for]="datepicker" />
  </ids-form-field>
</div>
