<div class="flex flex-wrap items-start gap-ids-container-gap-16">
  <div class="flex flex-col gap-ids-container-gap-8">
    <span>{{ "EXAMPLES.DIALOG.CLOSE_BUTTON.CONTENT.WITH_CLOSE_BUTTON" | translate }}</span>
    <button type="button" idsButton appearance="filled" size="comfortable" variant="primary" (click)="closeButtonDialog.open()">
      {{ "EXAMPLES.DIALOG.COMMON.OPEN" | translate }}
    </button>

    <ids-dialog
      #closeButtonDialog="idsDialog"
      [mainTitle]="'EXAMPLES.DIALOG.CLOSE_BUTTON.CONTENT.MAIN_TITLE' | translate"
      [showCloseButton]="true"
    >
      <div idsDialogContent>
        <p>{{ "EXAMPLES.DIALOG.CLOSE_BUTTON.CONTENT.BODY" | translate }}</p>
      </div>

      <ng-container idsDialogActions>
        <button type="button" idsButton appearance="filled" size="comfortable" variant="primary" (click)="closeButtonDialog.close()">
          {{ "EXAMPLES.DIALOG.COMMON.OK" | translate }}
        </button>
      </ng-container>
    </ids-dialog>
  </div>

  <div class="flex flex-col gap-ids-container-gap-8">
    <span>{{ "EXAMPLES.DIALOG.CLOSE_BUTTON.CONTENT.DISABLED_CLOSE_BUTTON" | translate }}</span>
    <button type="button" idsButton appearance="filled" size="comfortable" variant="primary" (click)="disabledCloseButtonDialog.open()">
      {{ "EXAMPLES.DIALOG.COMMON.OPEN" | translate }}
    </button>

    <ids-dialog
      #disabledCloseButtonDialog="idsDialog"
      [mainTitle]="'EXAMPLES.DIALOG.CLOSE_BUTTON.CONTENT.MAIN_TITLE' | translate"
      [isCloseButtonDisabled]="true"
      [showCloseButton]="true"
    >
      <div idsDialogContent>
        <p>{{ "EXAMPLES.DIALOG.CLOSE_BUTTON.CONTENT.DISABLED_BODY" | translate }}</p>
      </div>

      <ng-container idsDialogActions>
        <button type="button" idsButton appearance="filled" size="comfortable" variant="primary" (click)="disabledCloseButtonDialog.close()">
          {{ "EXAMPLES.DIALOG.COMMON.OK" | translate }}
        </button>
      </ng-container>
    </ids-dialog>
  </div>
</div>
