<div class="flex flex-col gap-8 w-full">
  <div class="grid gap-2">
    <span>{{ "EXAMPLES.TABLE.APPEARANCES.CONTENT.LINE_DIVISION" | translate }}</span>
    <ids-table appearance="line-division" [columnDefs]="_columnDefs" [dataSource]="_dataSource">
      <ng-template let-value="cellValue" idsCellTemplate="translateHeader">
        {{ value | translate }}
      </ng-template>
    </ids-table>
  </div>
  <div class="grid gap-2">
    <span>{{ "EXAMPLES.TABLE.APPEARANCES.CONTENT.ZEBRA" | translate }}</span>
    <ids-table appearance="zebra" [columnDefs]="_columnDefs" [dataSource]="_dataSource">
      <ng-template let-value="cellValue" idsCellTemplate="translateHeader">
        {{ value | translate }}
      </ng-template>
    </ids-table>
  </div>
  <div class="grid gap-2">
    <span>{{ "EXAMPLES.TABLE.APPEARANCES.CONTENT.PLAIN" | translate }}</span>
    <ids-table appearance="plain" [columnDefs]="_columnDefs" [dataSource]="_dataSource">
      <ng-template let-value="cellValue" idsCellTemplate="translateHeader">
        {{ value | translate }}
      </ng-template>
    </ids-table>
  </div>
</div>
