<div class="flex flex-col gap-ids-container-gap-8">
  <dl class="grid gap-2 text-sm">
    <div class="flex gap-2">
      <dt class="font-medium">position:</dt>
      <dd>{{ _defaultConfig.position }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="font-medium">size:</dt>
      <dd>{{ _defaultConfig.size }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="font-medium">viewportMargin:</dt>
      <dd>{{ _defaultConfig.viewportMargin }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="font-medium">newestAtStartPosition:</dt>
      <dd>{{ _defaultConfig.newestAtStartPosition }}</dd>
    </div>
  </dl>

  <button type="button" idsButton (click)="_open()">
    {{ "EXAMPLES.SNACKBAR.COMMON.OPEN" | translate }}
  </button>
</div>
