<div class="flex flex-col gap-ids-container-gap-8 w-full">
  <div class="grid gap-2 px-3">
    <span>dense</span>
    <button #denseOrigin="cdkOverlayOrigin" type="button" cdkOverlayOrigin idsButton appearance="outlined" size="compact" variant="primary" (click)="densePanel.toggle()">
      {{ (densePanel.open() ? "EXAMPLES.OVERLAY_PANEL.COMMON.CLOSE" : "EXAMPLES.OVERLAY_PANEL.COMMON.OPEN") | translate }}
    </button>
    <ids-overlay-panel #densePanel size="dense" [origin]="denseOrigin">
      <p class="min-w-48 px-4 py-3">{{ "EXAMPLES.OVERLAY_PANEL.COMMON.SAMPLE_CONTENT" | translate }}</p>
    </ids-overlay-panel>
  </div>

  <div class="grid gap-2 px-3">
    <span>compact</span>

    </ids-overlay-panel>
  </div>

    <span>comfortable</span>

      {{ (comfortablePanel.open() ? "EXAMPLES.OVERLAY_PANEL.COMMON.CLOSE" : "EXAMPLES.OVERLAY_PANEL.COMMON.OPEN") | translate }}
    </button>
    <ids-overlay-panel #comfortablePanel size="comfortable" [origin]="comfortableOrigin">
      <p class="min-w-48 px-4 py-3">{{ "EXAMPLES.OVERLAY_PANEL.COMMON.SAMPLE_CONTENT" | translate }}</p>
    </ids-overlay-panel>
  </div>

  <div class="grid gap-2 px-3">
    <span>spacious</span>

    </ids-overlay-panel>
  </div>
</div>
