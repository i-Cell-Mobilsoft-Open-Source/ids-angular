<fieldset class="ids-checkbox-group__fieldset" [class.ids-checkbox-group__fieldset--has-hint]="_hasHint()"
  [class.ids-checkbox-group__fieldset--empty-legend]="!groupLabel().length && !_shouldShowAsterisk"
  [attr.aria-label]="_accessibleLabel()" [attr.aria-labelledby]="_accessibleLabelledBy()">
  <legend class="ids-checkbox-group__legend-wrapper">
    <span class="ids-checkbox-group__legend-container">
      @if (_shouldShowAsterisk) {
        <span class="ids-checkbox-group__required-marker" aria-hidden="true"></span>
      }
      <span class="ids-checkbox-group__legend-label" [id]="_groupLabelId()">{{ groupLabel() }} </span>
    </span>
  </legend>
  @if (_hasHint()) {
    <div class="ids-checkbox-group__hint">
      <ng-content select="ids-hint-message" />
    </div>
  }
  @if (allowParent()) {
    <div class="ids-checkbox-group__parent">
      <ids-checkbox
        [checked]="_parentCheckboxChecked()"
        [indeterminate]="_parentCheckboxIndeterminate()"
        [disabled]="_parentCheckboxDisabled()"
        (change)="_handleParentChange($event)"
        >{{ parentCheckboxLabel() }}</ids-checkbox
      >
    </div>
  }
  <div class="ids-checkbox-group__list">
    <ng-content select="ids-checkbox" />
  </div>
  <div class="ids-checkbox-group__error-container">
    <ng-content select="ids-error-message" />
  </div>
</fieldset>
