<div class="flex flex-col gap-ids-container-gap-24" style="width: 500px;">
  <div class="flex flex-col gap-ids-container-gap-12">
    <p class="font-medium m-0">Overlay appearances</p>
    <div class="flex flex-col gap-ids-container-gap-12">
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Filled</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlayAppearance="filled" [hierarchy]="hierarchy" />
        </div>
      </div>
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Outlined</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlayAppearance="outlined" [hierarchy]="hierarchy" />
        </div>
      </div>
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Elevated</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlayAppearance="elevated" [hierarchy]="hierarchy" />
        </div>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-ids-container-gap-12">
    <p class="font-medium m-0">Overlay sizes</p>
    <div class="flex flex-col gap-ids-container-gap-12">
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Dense</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlaySize="dense" [hierarchy]="hierarchy" />
        </div>
      </div>
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Compact</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlaySize="compact" [hierarchy]="hierarchy" />
        </div>
      </div>
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Comfortable</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlaySize="comfortable" [hierarchy]="hierarchy" />
        </div>
      </div>
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Spacious</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlaySize="spacious" [hierarchy]="hierarchy" />
        </div>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-ids-container-gap-12">
    <p class="font-medium m-0">Overlay variants</p>
    <div class="flex flex-col gap-ids-container-gap-12">
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Surface</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlayVariant="surface" [hierarchy]="hierarchy" />
        </div>
      </div>
      <div class="flex flex-col gap-ids-container-gap-4">
        <span>Light</span>
        <div class="w-72 max-w-full">
          <ids-breadcrumb overlayVariant="light" [hierarchy]="hierarchy" />
        </div>
      </div>
    </div>
  </div>
</div>
