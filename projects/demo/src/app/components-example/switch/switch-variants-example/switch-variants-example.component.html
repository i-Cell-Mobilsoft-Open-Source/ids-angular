<div class="flex flex-col gap-8">
  <div class="grid gap-2 p-2">
    <span>primary</span>
    <ids-switch variant="primary" [label]="'EXAMPLES.SWITCH.COMMON.LABEL' | translate" [(ngModel)]="primary" />
  </div>

  <div class="grid gap-2 p-2">
    <span>surface</span>
    <ids-switch variant="surface" [label]="'EXAMPLES.SWITCH.COMMON.LABEL' | translate" [(ngModel)]="surface" />
  </div>

  <div class="grid gap-2 p-2 bg-black">
    <span class="text-white">light</span>
    <ids-switch variant="light" [label]="'EXAMPLES.SWITCH.COMMON.LABEL' | translate" [(ngModel)]="light" />
  </div>
</div>
