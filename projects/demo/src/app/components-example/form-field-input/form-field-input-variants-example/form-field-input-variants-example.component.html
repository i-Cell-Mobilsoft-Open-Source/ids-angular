<div class="flex flex-col gap-ids-container-gap-4 max-w-80">
  <ids-form-field variant="surface">
    <ids-label>{{ "FORM_FIELD.LABEL.NAME" | translate }}</ids-label>
    <input idsInput [placeholder]="'EXAMPLES.FORM_FIELD_INPUT.VARIANTS.CONTENT.PLACEHOLDER_SURFACE' | translate" [(ngModel)]="surface" />
  </ids-form-field>
  <ids-form-field variant="light">
    <ids-label>{{ "FORM_FIELD.LABEL.NAME" | translate }}</ids-label>
    <input idsInput [placeholder]="'EXAMPLES.FORM_FIELD_INPUT.VARIANTS.CONTENT.PLACEHOLDER_LIGHT' | translate" [(ngModel)]="light" />
  </ids-form-field>
  <ids-form-field variant="surface">
    <ids-label>{{ "FORM_FIELD.LABEL.NAME" | translate }}</ids-label>
    <input
      idsInput
      [disabled]="true"
      [(ngModel)]="disabled"
    />
  </ids-form-field>
  <ids-form-field variant="surface">
    <ids-label>{{ "FORM_FIELD.LABEL.NAME" | translate }}</ids-label>
    <input
      idsInput
      [readonly]="true"
      [(ngModel)]="readonly"
    />
  </ids-form-field>
</div>
