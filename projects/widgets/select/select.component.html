<div #trigger #fallbackOverlayOrigin="cdkOverlayOrigin" cdk-overlay-origin class="ids-select__trigger" (click)="open()">
  <div class="ids-select__value">
    @if (_empty()) {
      <span class="ids-select__placeholder">{{ placeholder() }}</span>
    } @else {
      <span class="ids-select__value-text">
        @if (_customTrigger()) {
          <ng-content select="ids-select-trigger" />
        } @else {
          {{ _triggerValue() }}
        }
      </span>
    }
  </div>

  <div class="ids-select__arrow">
    <ids-icon fontIcon="chevron-down" />
  </div>
</div>
<ids-overlay-panel
  #overlayPanel
  [origin]="_preferredOverlayOrigin || fallbackOverlayOrigin"
  [open]="isPanelOpen()"
  [positions]="_connectedPositions"
  [width]="_overlayWidth"
  [size]="parentSize()"
  [variant]="parentVariant()"
  [panelClasses]="_overlayPanelClasses()"
  (attached)="_panelAttached()"
  (openChange)="_handlePanelOpenChange($event)"
>
  <div
    #panel
    role="listbox"
    tabindex="-1"
    [attr.id]="id() + '-panel'"
    [attr.aria-multiselectable]="multiSelect()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby()"
    [class]="_panelClasses()"
    (keydown)="_handleKeydown($event)"
  >
    <ng-content />
  </div>
</ids-overlay-panel>
