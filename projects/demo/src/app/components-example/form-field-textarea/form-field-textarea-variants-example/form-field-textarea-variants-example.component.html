<div class="flex flex-col gap-ids-container-gap-4 max-w-80">
  <ids-form-field variant="surface">
    <ids-label>{{ "EXAMPLES.FORM_FIELD_TEXTAREA.VARIANTS.CONTENT.LABEL" | translate }}</ids-label>
    <textarea
      idsInput
      rows="3"
      [placeholder]="'EXAMPLES.FORM_FIELD_TEXTAREA.VARIANTS.CONTENT.PLACEHOLDER_SURFACE' | translate"
      [(ngModel)]="surface"
    ></textarea>
  </ids-form-field>
  <ids-form-field variant="light">
    <ids-label>{{ "EXAMPLES.FORM_FIELD_TEXTAREA.VARIANTS.CONTENT.LABEL" | translate }}</ids-label>
    <textarea
      idsInput
      rows="3"
      [placeholder]="'EXAMPLES.FORM_FIELD_TEXTAREA.VARIANTS.CONTENT.PLACEHOLDER_LIGHT' | translate"
      [(ngModel)]="light"
    ></textarea>
  </ids-form-field>
  <ids-form-field variant="surface">
    <ids-label>{{ "EXAMPLES.FORM_FIELD_TEXTAREA.VARIANTS.CONTENT.LABEL" | translate }}</ids-label>
    <textarea idsInput rows="3" [disabled]="true" [(ngModel)]="disabled"></textarea>
  </ids-form-field>
  <ids-form-field variant="surface">
    <ids-label>{{ "EXAMPLES.FORM_FIELD_TEXTAREA.VARIANTS.CONTENT.LABEL" | translate }}</ids-label>
    <textarea idsInput rows="3" [readonly]="true" [(ngModel)]="readonly"></textarea>
  </ids-form-field>
</div>
