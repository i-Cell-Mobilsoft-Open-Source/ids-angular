<div class="flex flex-col gap-ids-container-gap-16 w-80">
  @for (variant of spinnerVariants; track variant) {
    <div class="flex flex-col gap-ids-container-gap-8">
      <span>{{ variant }}</span>
      <ids-form-field variant="surface">
        <ids-label>{{ "EXAMPLES.AUTOCOMPLETE.COMMON.FRUIT" | translate }}</ids-label>
        <input
          #autocompleteTrigger="idsAutocompleteTrigger"
          type="text"
          [placeholder]="'EXAMPLES.AUTOCOMPLETE.COMMON.PLACEHOLDER' | translate"
          [idsAutocompleteTriggerFor]="autoComplete"
        />
        <ids-autocomplete
          #autoComplete="idsAutocomplete"
          [ariaLabelClear]="'EXAMPLES.AUTOCOMPLETE.COMMON.CLEAR' | translate"
          [ariaLabelLoading]="'EXAMPLES.AUTOCOMPLETE.COMMON.LOADING' | translate"
          [isLoading]="true"
          [spinnerVariant]="variant"
          [trigger]="autocompleteTrigger"
          [(ngModel)]="values[variant]"
        >
          <ids-autocomplete-hint>{{ "EXAMPLES.AUTOCOMPLETE.COMMON.LOADING" | translate }}</ids-autocomplete-hint>
        </ids-autocomplete>
      </ids-form-field>
    </div>
  }
</div>
