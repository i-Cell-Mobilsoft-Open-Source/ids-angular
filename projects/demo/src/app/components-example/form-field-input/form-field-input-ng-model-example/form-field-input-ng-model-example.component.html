@let fieldName = "FORM_FIELD.LABEL.NAME" | translate;

<form class="flex flex-col gap-ids-container-gap-4 max-w-80" (ngSubmit)="onSubmit(nameField)">
  <ids-form-field>
    <ids-label>{{ fieldName }}</ids-label>
    <input
      #nameField="ngModel"
      idsInput
      name="name"
      minlength="3"
      required
      [placeholder]="'EXAMPLES.FORM_FIELD_INPUT.NG_MODEL.CONTENT.PLACEHOLDER' | translate"
      [(ngModel)]="name"
    />
    <ids-hint-message>{{ "EXAMPLES.FORM_FIELD_INPUT.NG_MODEL.CONTENT.HINT" | translate }}</ids-hint-message>
    <ids-error-message>
      <ids-error-def code="required">{{ "FORM_FIELD.ERROR.REQUIRED" | translate: { fieldName } }}</ids-error-def>
      <ids-error-def code="minlength">{{ "FORM_FIELD.ERROR.MINLENGTH" | translate: { fieldName, requiredLength: 3 } }}</ids-error-def>
    </ids-error-message>
  </ids-form-field>
  <button type="submit" idsButton>{{ "EXAMPLES.FORM_FIELD_INPUT.NG_MODEL.CONTENT.SUBMIT" | translate }}</button>
</form>
