<fieldset class="ids-radio-group__fieldset" [class.ids-radio-group__fieldset--has-hint]="_hasHint()"
  [attr.aria-label]="_accessibleLabel()" [attr.aria-labelledby]="_accessibleLabelledBy()">
  @if (groupLabel().length > 0) {
    <legend class="ids-radio-group__legend">
      <span class="ids-radio-group__legend-container">
        @if (hasRequiredValidator()) {
          <span class="ids-radio-group__required-marker" aria-hidden="true"></span>
        }
        <span class="ids-radio-group__legend-label" [id]="_groupLabelId()">{{ groupLabel() }}</span>
      </span>
    </legend>
  }
  @if (_hasHint()) {
    <div class="ids-radio-group__hint">
      <ng-content select="ids-hint-message" />
    </div>
  }
  <div class="ids-radio-group__list">
    <ng-content />
  </div>
  <div class="ids-radio-group__error-container">
    <ng-content select="ids-error-message" />
  </div>
</fieldset>
