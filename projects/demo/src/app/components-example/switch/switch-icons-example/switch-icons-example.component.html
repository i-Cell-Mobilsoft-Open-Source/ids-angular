<div class="flex flex-col gap-8">
  <div class="grid gap-2">
    <span>onhandle</span>
    <ids-switch
      iconPosition="onhandle"
      [hasIcon]="true"
      [label]="'EXAMPLES.SWITCH.COMMON.LABEL' | translate"
      [(ngModel)]="onHandle"
    />
  </div>

  <div class="grid gap-2">
    <span>ontrack</span>
    <ids-switch
      iconPosition="ontrack"
      [hasIcon]="true"
      [label]="'EXAMPLES.SWITCH.COMMON.LABEL' | translate"
      [(ngModel)]="onTrack"
    />
  </div>
</div>
