<app-demo-and-code (resetDemo)="_messageDemoService.reset();">
  <div demo class="w-full h-full flex justify-center items-center">
    <app-tryout
      [title]="'COMPONENTS.MESSAGE' | translate"
      [hasDarkBackground]="_messageDemoService.model.variant === 'light'"
      (resetted)="_messageDemoService.reset();"
    >
      <div component class="message-grid">
        <app-message-demo-tryout />
      </div>
    </app-tryout>
  </div>

  <div controls class="h-full">
    <app-tryout-controls>
      <app-control-table
        controls
        controlName="Message Appearance"
        configType="input"
        [controlConfig]="_messageDemoService.messageInputControlConfig"
        [(model)]="_messageDemoService.model"
        (resetted)="_messageDemoService.reset();"
      />
      <app-control-table
        controls
        controlName="Message Content"
        configType="helper"
        [controlConfig]="_messageDemoService.messageHelperControlConfig"
        [(model)]="_messageDemoService.helperModel"
        (resetted)="_messageDemoService.reset();"
      />
      <app-control-table
        controls
        controlName="Message State"
        configType="input"
        [controlConfig]="_messageDemoService.messageInputControlConfigInput"
        [(model)]="_messageDemoService.inputModel"
        (resetted)="_messageDemoService.reset();"
      />
    </app-tryout-controls>
  </div>
</app-demo-and-code>

<div examples class="flex flex-col gap-6 w-full pt-6 pb-2">
  @for (example of messageExamples; track example.id) {
    <ids-example-viewer [example]="example" />
  }
</div>
